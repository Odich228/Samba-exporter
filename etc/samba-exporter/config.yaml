server:
  listen_address: "0.0.0.0:9102"
  read_timeout: "5s"
  write_timeout: "10s"

samba:
  config_path: "/etc/samba/smb.conf"
  smbstatus_path: "/usr/bin/smbstatus"

  intervals:
    size_scan: "5m"
    ad_update: "30m"

  collectors:
    enable_du: true
    enable_sessions: true
    enable_locks: true
    enable_perf: true
    enable_ad: true

  user_filter:
    exclude_system: true
    exclude_list: ["guest", "nobody"]
